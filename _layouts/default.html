---
layout: compress
---
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e0a">
  <meta name="description" content="{{ page.description | default: 'Portfolio de Álvaro Cano, Cybersecurity Engineer especializado en seguridad ofensiva.' }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/variables.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/reset.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/style.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/effects.css">
</head>

<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }}, inicio"><span class="brand-mark">[</span> ACANO <span class="brand-mark">]</span></a>
    <nav class="site-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="{{ site.baseurl }}/#about">Sobre mí</a></li>
        <li><a href="{{ site.baseurl }}/#certifications">Certificaciones</a></li>
        <li><a href="{{ site.baseurl }}/#arsenal">Arsenal</a></li>
        <li><a href="{{ site.baseurl }}/#projects">Proyectos</a></li>
        <li><a href="{{ site.baseurl }}/#notes">Apuntes</a></li>
        <li><a href="{{ site.baseurl }}/#contact">Contacto</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="page-shell">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>Álvaro Cano Mantero · Madrid, España</span>
    <a href="{{ site.baseurl }}/#top">Volver arriba ↑</a>
  </div>
</footer>

{% include analytics.html %}
<script src="{{ site.baseurl }}/js/main.js" defer></script>
<script src="{{ site.baseurl }}/js/crosshair.js" defer></script>
</body>
</html>
